name: Build iOS app

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Test & build
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run shared unit tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
      - name: iOS debug build
        run: cd iosApp && xcodebuild -scheme iosApp -configuration Debug -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED='NO'
